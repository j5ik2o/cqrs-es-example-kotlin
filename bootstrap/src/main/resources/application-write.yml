spring:
  config:
    import: classpath:application-common.yml
  graphql:
    schema:
      locations: classpath*:graphql-write/**/
server:
  port: ${SERVER_PORT:56080}
app:
  persistence:
    journal-table-name: ${JOURNAL_TABLE_NAME:journal}
    snapshot-table-name: ${SNAPSHOT_TABLE_NAME:snapshot}
    head-table-name: ${HEAD_TABLE_NAME:head}
    snapshot-aid-index-name: ${SNAPSHOT_AID_INDEX_NAME:snapshot-aid-index}
    snapshot-interval: ${SNAPSHOT_INTERVAL:10}
