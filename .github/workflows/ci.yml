name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck --no-daemon

  deploy-assets:
    name: Deployment assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install cfn-lint
      - run: cfn-lint deploy/rmu-deployment.template.json
      - run: |
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/measure-lambda-package.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :rmu:lambdaZip --no-daemon
      - run: |
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/kotlin/rmu/RmuLambdaHandler.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/kotlin/rmu/RecoveryWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/kotlin/rmu/ResyncWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'lib/aws-lambda-java-events'
      - name: Log Lambda package size and JAR breakdown
        run: ./deploy/measure-lambda-package.sh --skip-build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --no-daemon

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./tools/scripts/docker-compose-e2e-test.sh
