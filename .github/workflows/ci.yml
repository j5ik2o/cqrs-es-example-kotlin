name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Base changes are edited events. Run the checks on metadata edits as well
    # so a skipped job cannot satisfy a required check.
    types: [opened, synchronize, reopened, edited]

jobs:
  revision:
    name: CI Revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.resolve.outputs.checkout_ref }}
      test_merge: ${{ steps.resolve.outputs.test_merge }}
      bundle: ${{ steps.resolve.outputs.bundle_name }}
    steps:
      # Load the resolver from the revision that defines this workflow; a PR
      # branch that predates it does not have the script.
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the test merge resolution
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test .github/scripts/pr-test-merge.test.mjs
      # Check the current base tip and PR head, not the event's base SHA.
      - name: Resolve the PR's test merge
        id: resolve
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pr-test-merge.sh
      - uses: actions/upload-artifact@v7
        if: ${{ steps.resolve.outputs.bundle_name != '' }}
        with:
          name: ${{ steps.resolve.outputs.bundle_name }}
          path: ${{ runner.temp }}/pr-test-merge.bundle
          if-no-files-found: error
          # After expiry, re-run all jobs so this job builds the bundle again.
          retention-days: 1

  lint:
    name: Lint
    needs: revision
    # Lint is required on its own. Run it even when the resolver fails, so the
    # verify step fails Lint instead of leaving a skipped check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.revision.outputs.ref }}
          # The bundle of a locally built test merge needs the base history.
          fetch-depth: ${{ needs.revision.outputs.bundle != '' && '0' || '1' }}
          persist-credentials: false
      - &download-test-merge
        uses: actions/download-artifact@v7
        if: ${{ needs.revision.outputs.bundle != '' }}
        with:
          name: ${{ needs.revision.outputs.bundle }}
          path: ${{ runner.temp }}/pr-test-merge
      - &verify-test-merge
        name: Verify the checked out test merge
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TEST_MERGE: ${{ needs.revision.outputs.test_merge }}
          BUNDLE: ${{ needs.revision.outputs.bundle }}
        run: |
          if [[ -n "$BUNDLE" ]]; then
            git fetch --quiet --no-tags "$RUNNER_TEMP/pr-test-merge/pr-test-merge.bundle" refs/pr-ci/merge
            git checkout --quiet --detach FETCH_HEAD
          fi
          # A shallow checkout hides parents from %P; the commit object keeps them.
          actual="$(git rev-parse HEAD)$(git cat-file commit HEAD | awk '!NF { exit } $1 == "parent" { printf " %s", $2 }')"
          printf 'Checked out test merge (SHA, base, head): %s\n' "$actual"
          if [[ -z "$TEST_MERGE" || "$actual" != "$TEST_MERGE" ]]; then
            printf '::error::Expected test merge %s\n' "${TEST_MERGE:-missing}"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck --no-daemon

  deploy-assets:
    name: Deployment assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [revision, lint]
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install cfn-lint
      - run: cfn-lint deploy/rmu-deployment.template.json
      - run: |
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/measure-lambda-package.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :rmu:lambdaZip --no-daemon
      - run: |
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/kotlin/rmu/RmuLambdaHandler.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/kotlin/rmu/RecoveryWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/kotlin/rmu/ResyncWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'lib/aws-lambda-java-events'
      - name: Log Lambda package size and JAR breakdown
        run: ./deploy/measure-lambda-package.sh --skip-build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [revision, lint]
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --no-daemon

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [revision, lint]
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - run: ./tools/scripts/docker-compose-e2e-test.sh

  aislop:
    name: Aislop
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
      - run: npm ci
      - run: npm run check:aislop
      - run: npm run test:aislop

  required:
    name: CI Required
    needs: [revision, lint, deploy-assets, test, e2e, aislop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          REVISION_RESULT: ${{ needs.revision.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DEPLOY_ASSETS_RESULT: ${{ needs.deploy-assets.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AISLOP_RESULT: ${{ needs.aislop.result }}
        shell: bash
        run: |
          failed=0
          for job in REVISION LINT DEPLOY_ASSETS TEST E2E AISLOP; do
            variable="${job}_RESULT"
            result="${!variable}"
            if [[ "$result" != success ]]; then
              printf '::error::%s result: %s\n' "$job" "${result:-missing}"
              failed=1
            fi
          done
          exit "$failed"
