services:
  localstack:
    image: localstack/localstack:2.3.2
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,dynamodbstreams
      DEFAULT_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"dynamodb\"'"]
      interval: 2s
      timeout: 5s
      retries: 30

  dynamodb-setup:
    image: amazon/aws-cli:2.17.0
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      AWS_DEFAULT_REGION: ap-northeast-1
      DYNAMODB_ENDPOINT: localstack:4566
      JOURNAL_TABLE_NAME: journal
      SNAPSHOT_TABLE_NAME: snapshot
      HEAD_TABLE_NAME: head
      SNAPSHOT_AID_INDEX_NAME: snapshot-aid-index
    volumes:
      - ../dynamodb-setup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-tables.sh"]

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: passwd
      MYSQL_DATABASE: ceer
      MYSQL_USER: ceer
      MYSQL_PASSWORD: ceer
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=ceer mysql -h127.0.0.1 -uceer -e 'SELECT 1' ceer"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  migration:
    image: flyway/flyway:11
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://mysql:3306/ceer
      - -user=ceer
      - -password=ceer
      - -connectRetries=60
      - migrate
    volumes:
      - ../refinery/migrations:/flyway/sql:ro

volumes:
  localstack-data:
  mysql-data:
